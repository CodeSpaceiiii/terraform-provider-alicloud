        DIFF_HEAD: e515c3c37b515e32c6aeec328d5109bc505f3713
      run: |
        python3 - <<'PYTHON'
        import json, os, pathlib, subprocess, tempfile, time
        checks = {'basic-check': 'bash scripts/basic-check.sh', 'Content': 'checker="$RUNNER_TEMP/document-check"\ngo build -o "$checker" scripts/document/document_check.go\nwhile IFS= read -r -d \'\' changed_file; do\n  if [[ -f "$changed_file" ]]; then\n    "$checker" "$changed_file"\n  fi\ndone < <(\n  git diff --name-only -z --diff-filter=ACMR \\\n    "$DIFF_BASE" "$DIFF_HEAD" -- website/docs\n)\n', 'misspell': '"$HOME/.cache/terraform-doc-tools/misspell" \\\n  -error \\\n  -i \'bussiness,protocal,attemps,alltime,transfering\' \\\n  website/docs\n', 'terrafmt': '"$HOME/.cache/terraform-doc-tools/terrafmt" diff ./website --check --pattern \'*.markdown\'\n'}
        folder = pathlib.Path(tempfile.mkdtemp(prefix="ci-checks-"))
        processes = []
        for name, command in checks.items():
            log = folder / (name + ".log")
            stream = log.open("w")
            started = time.monotonic()
            process = subprocess.Popen(["bash", "-e", "-o", "pipefail", "-c", command], stdout=stream, stderr=subprocess.STDOUT)
            processes.append((name, process, stream, log, started))
